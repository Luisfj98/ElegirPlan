<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f6fb" />
  <title>Tengo un plan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #f4f6fb 0%, #e6ebf5 100%);
      color: #1f2937;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .pantalla {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(12px, 3vh, 24px) 16px;
      text-align: center;
      overflow-y: auto;
    }
    /* Espaciadores: centran el contenido, pero si no cabe se puede hacer scroll sin que se corte por arriba */
    .pantalla::before, .pantalla::after { content: ''; flex: 1 0 0; }
    .pantalla.activa { display: flex; animation: aparecer .5s ease; }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .emoji { font-size: 64px; margin-bottom: 12px; }

    h1 {
      font-size: clamp(26px, 6vw, 44px);
      margin-bottom: 32px;
      line-height: 1.2;
    }

    .botones {
      display: flex;
      gap: 20px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(31, 41, 55, .2);
    }

    #btn-si {
      background: #2563eb;
      color: #fff;
      font-size: 22px;
      padding: 14px 36px;
      transition: transform .25s ease;
      transform-origin: top center;
      position: relative;
      z-index: 2;
    }
    #btn-si:hover { background: #1d4ed8; }

    #btn-no {
      background: #fff;
      color: #1f2937;
      font-size: 22px;
      padding: 14px 36px;
      transition: left .2s ease, top .2s ease;
      z-index: 10;
      touch-action: none;
    }

    /* Pantalla de planes */
    .planes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 560px;
      margin-bottom: 20px;
    }

    /* En la pantalla de planes la cuadrícula ocupa el alto disponible:
       las tarjetas crecen en pantallas altas y se encogen en las bajas */
    #p-planes::before, #p-planes::after { flex: 0 1 3vh; }
    #p-planes .planes {
      flex: 1 1 auto;
      grid-auto-rows: minmax(min-content, 1fr);
      max-height: 620px;
      margin-bottom: clamp(6px, 1.6vh, 20px);
    }
    #p-planes #btn-confirmar { flex-shrink: 0; }

    .plan {
      background: #fff;
      color: #1f2937;
      border: 3px solid transparent;
      padding: clamp(4px, 1vh, 10px) 6px;
      font-size: clamp(15px, 2.2vh, 19px);
      line-height: 1.2;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(31, 41, 55, .12);
      transition: transform .15s ease, border-color .15s ease;
    }
    .plan .icono { display: block; font-size: clamp(20px, 3.8vh, 40px); margin-bottom: clamp(2px, .8vh, 8px); }

    /* Cabecera más compacta en la pantalla de planes para que quepa todo */
    #p-planes .emoji { font-size: clamp(30px, 6vh, 64px); margin-bottom: clamp(2px, 1vh, 12px); }
    #p-planes h1 { font-size: clamp(22px, min(5.5vw, 4.4vh), 36px); margin-bottom: clamp(8px, 2.5vh, 28px); }
    .plan:hover { transform: translateY(-2px); }
    .plan.elegido { border-color: #2563eb; background: #eff4ff; }
    .plan.combinable { border: 3px dashed #93b4f5; }

    #pista-combinar {
      visibility: hidden;
      max-width: 560px;
      margin: 0 0 clamp(6px, 1.6vh, 18px);
      font-size: 15px;
      flex-shrink: 0;
      color: #2563eb;
      font-weight: 600;
    }
    #pista-combinar.visible { visibility: visible; }

    #otro-wrap {
      width: 100%;
      max-width: 560px;
      display: none;
      margin-bottom: 20px;
    }
    #otro-wrap.visible { display: block; }

    #otro-texto {
      width: 100%;
      font-family: inherit;
      font-size: 17px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 2px solid #2563eb;
      outline: none;
      resize: none;
      color: #1f2937;
    }

    #btn-confirmar {
      background: #2563eb;
      color: #fff;
      font-size: 20px;
      padding: 14px 40px;
    }
    #btn-confirmar:disabled, #btn-fecha-ok:disabled { opacity: .4; cursor: not-allowed; }

    /* Pantalla de fecha y hora */
    .campos {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 360px;
      margin-bottom: 24px;
      text-align: left;
    }
    .campos label { font-weight: 600; font-size: 16px; }
    .campos input {
      display: block;
      width: 100%;
      margin-top: 6px;
      font-family: inherit;
      font-size: 18px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 2px solid #cbd5e1;
      background: #fff;
      color: #1f2937;
      outline: none;
    }
    .campos input:focus { border-color: #2563eb; }

    #btn-fecha-ok {
      background: #2563eb;
      color: #fff;
      font-size: 20px;
      padding: 14px 40px;
    }

    .resumen {
      font-size: clamp(20px, 5vw, 28px);
      margin-bottom: 28px;
      max-width: 560px;
    }
    .resumen strong { color: #2563eb; }

    #btn-whatsapp {
      background: #25d366;
      color: #fff;
      font-size: 18px;
      padding: 14px 30px;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 6px 16px rgba(31, 41, 55, .2);
      display: inline-block;
    }

    .volver {
      margin-top: 18px;
      background: none;
      box-shadow: none;
      color: #1f2937;
      text-decoration: underline;
      font-weight: 400;
      font-size: 15px;
    }

    /* Animación Cupra */
    #cupra-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #1c1c1c 0%, #000 100%);
      cursor: pointer;
      overflow: hidden;
    }
    #cupra-overlay.visible {
      display: flex;
      animation: overlay 2.4s ease forwards;
    }
    #cupra-anim {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    /* El coche entra desde la izquierda, frena con un pequeño rebote y se queda (sin difuminar) */
    #cupra-coche {
      width: min(88vw, 600px, 90vh);
      height: auto;
      filter: drop-shadow(0 18px 18px rgba(0, 0, 0, .8));
      transform: translateX(-130vw);
    }
    #cupra-overlay.visible #cupra-coche {
      animation: entrar .9s cubic-bezier(.15, .7, .3, 1) .1s forwards;
    }

    /* Después aparece el logo debajo */
    #cupra-marca { opacity: 0; }
    #cupra-overlay.visible #cupra-marca {
      animation: logo .5s cubic-bezier(.2, .8, .2, 1) .9s forwards;
    }
    #cupra-logo {
      width: min(45vw, 230px, 28vh);
      height: auto;
      display: block;
      filter: drop-shadow(0 0 20px rgba(193, 125, 76, .7));
    }
    #cupra-texto {
      display: none;
      font-size: min(14vw, 90px);
      font-weight: 800;
      letter-spacing: .12em;
      color: #c17d4c;
      text-shadow: 0 0 24px rgba(193, 125, 76, .7);
    }
    #cupra-marca.sin-logo #cupra-logo { display: none; }
    #cupra-marca.sin-logo #cupra-texto { display: block; }

    @keyframes entrar {
      0%   { transform: translateX(-130vw) skewX(12deg); }
      60%  { transform: translateX(4vw) skewX(-4deg) rotate(-1deg); }
      80%  { transform: translateX(-1vw) skewX(1deg) rotate(.5deg); }
      100% { transform: translateX(0) skewX(0) rotate(0); }
    }
    @keyframes logo {
      0%   { transform: scale(.3); opacity: 0; }
      70%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes overlay {
      0%   { opacity: 0; }
      5%   { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Pantalla 1: la pregunta -->
  <section class="pantalla activa" id="p-pregunta">
    <div class="emoji">📅</div>
    <h1>¿Hacemos un plan?</h1>
    <div class="botones" id="botones">
      <button id="btn-si">SÍ</button>
      <button id="btn-no">NO</button>
    </div>
  </section>

  <!-- Pantalla 2: elegir plan -->
  <section class="pantalla" id="p-planes">
    <div class="emoji">🙌</div>
    <h1>¡Genial!<br>¿Qué plan te apetece?</h1>

    <div class="planes" id="planes">
      <button class="plan" data-plan="Vuelta en el Cupra"><span class="icono">🚗</span>Vuelta en el Cupra</button>
      <button class="plan" data-plan="Comida en Riaño"><span class="icono">🏔️</span>Comida en Riaño</button>
      <button class="plan" data-plan="Visitar un pueblo"><span class="icono">🏘️</span>Visitar un pueblo</button>
      <button class="plan" data-plan="Cocinar"><span class="icono">🍳</span>Cocinar</button>
      <button class="plan" data-plan="Dar un paseo"><span class="icono">🌳</span>Dar un paseo</button>
      <button class="plan" data-plan="Desayunar en un sitio nuevo"><span class="icono">🥐</span>Desayunar en un sitio nuevo</button>
      <button class="plan" data-plan="Cenar sushi"><span class="icono">🍣</span>Cenar sushi</button>
      <button class="plan" data-plan="OTRO"><span class="icono">✍️</span>OTRO</button>
    </div>

    <p id="pista-combinar">🚗 + Puedes combinarlo con «Comida en Riaño» o «Visitar un pueblo»</p>

    <div id="otro-wrap">
      <textarea id="otro-texto" rows="2" maxlength="200" placeholder="Escribe aquí tu plan..."></textarea>
    </div>

    <button id="btn-confirmar" disabled>¡Este!</button>
  </section>

  <!-- Pantalla 3: fecha y hora -->
  <section class="pantalla" id="p-fecha">
    <div class="emoji">🗓️</div>
    <h1>¿Cuándo quedamos?</h1>
    <div class="campos">
      <label>Día
        <input type="date" id="fecha" />
      </label>
      <label>Hora
        <input type="time" id="hora" step="300" />
      </label>
    </div>
    <button id="btn-fecha-ok" disabled>Hecho</button>
    <button class="volver" id="btn-volver-plan">Cambiar de plan</button>
  </section>

  <!-- Pantalla 4: confirmación -->
  <section class="pantalla" id="p-fin">
    <div class="emoji">✅</div>
    <h1>¡Plan cerrado!</h1>
    <p class="resumen">Has elegido: <strong id="plan-final"></strong><br>
      el <strong id="fecha-final"></strong> a las <strong id="hora-final"></strong></p>
    <a id="btn-whatsapp" href="#" target="_blank" rel="noopener">Enviármelo por WhatsApp</a>
    <button class="volver" id="btn-volver">Cambiar plan o fecha</button>
  </section>

  <!-- Animación del logo de Cupra -->
  <div id="cupra-overlay" aria-hidden="true">
    <div id="cupra-anim">
      <img id="cupra-coche" src="cupra-coche.webp" alt="Cupra" />
      <div id="cupra-marca">
        <img id="cupra-logo" src="cupra-logo.png" alt="" />
        <div id="cupra-texto">CUPRA</div>
      </div>
    </div>
  </div>

  <script>
    const mostrar = (id) => {
      document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
      document.getElementById(id).classList.add('activa');
    };

    // ---------- Pantalla 1: el NO se escapa y el SÍ crece ----------
    const btnSi = document.getElementById('btn-si');
    const btnNo = document.getElementById('btn-no');
    const textosNo = ['NO', '¿Seguro?', '¿De verdad?', 'Piénsalo bien', 'Ni lo intentes', '¡Venga ya!', 'Último aviso', 'Que no, que no'];
    let intentos = 0;
    let escala = 1;

    // Escala máxima para que el SÍ quepa entero en la pantalla sin tapar la pregunta.
    // El SÍ crece desde su borde de arriba (transform-origin: top center),
    // así que nunca sube hacia la pregunta: solo crece hacia los lados y hacia abajo.
    function escalaMaxima() {
      const margen = 16;
      const r = btnSi.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const medioAncho = Math.min(cx, window.innerWidth - cx) - margen;
      const altoLibre = window.innerHeight - r.top - margen;
      const maxX = medioAncho / (btnSi.offsetWidth / 2);
      const maxY = altoLibre / btnSi.offsetHeight;
      return Math.max(1, Math.min(maxX, maxY));
    }

    window.addEventListener('resize', () => {
      escala = Math.min(escala, escalaMaxima());
      btnSi.style.transform = `scale(${escala})`;
    });

    function escaparNo(e) {
      if (e) e.preventDefault();
      intentos++;

      // El SÍ crece con cada intento
      escala = Math.min(escala + 0.35, escalaMaxima());
      btnSi.style.transform = `scale(${escala})`;

      // El NO cambia de texto
      btnNo.textContent = textosNo[intentos % textosNo.length];

      // El NO salta a una posición aleatoria de la pantalla
      if (btnNo.style.position !== 'fixed') {
        const r = btnNo.getBoundingClientRect();
        btnNo.style.position = 'fixed';
        btnNo.style.left = r.left + 'px';
        btnNo.style.top = r.top + 'px';
      }
      const margen = 12;
      const ancho = btnNo.offsetWidth;
      const alto = btnNo.offsetHeight;
      const maxX = window.innerWidth - ancho - margen;
      const maxY = window.innerHeight - alto - margen;
      const si = btnSi.getBoundingClientRect();

      let x, y, tries = 0;
      do {
        x = margen + Math.random() * Math.max(0, maxX - margen);
        y = margen + Math.random() * Math.max(0, maxY - margen);
        tries++;
      } while (
        tries < 30 &&
        x < si.right && x + ancho > si.left && y < si.bottom && y + alto > si.top
      );

      btnNo.style.left = x + 'px';
      btnNo.style.top = y + 'px';
    }

    btnNo.addEventListener('mouseenter', escaparNo);
    btnNo.addEventListener('pointerdown', escaparNo);
    btnNo.addEventListener('touchstart', escaparNo, { passive: false });
    btnNo.addEventListener('click', escaparNo);   // por si llega con teclado
    btnNo.addEventListener('focus', () => btnNo.blur());

    btnSi.addEventListener('click', () => {
      btnNo.style.display = 'none';
      mostrar('p-planes');
    });

    // ---------- Pantalla 2: elegir plan ----------
    const planes = document.querySelectorAll('.plan');
    const otroWrap = document.getElementById('otro-wrap');
    const otroTexto = document.getElementById('otro-texto');
    const btnConfirmar = document.getElementById('btn-confirmar');
    const pista = document.getElementById('pista-combinar');

    // La vuelta en el Cupra se puede combinar con uno de estos planes
    const CUPRA = 'Vuelta en el Cupra';
    const COMBINABLES = ['Comida en Riaño', 'Visitar un pueblo'];
    let seleccion = [];   // planes elegidos (1, o 2 si es Cupra + combinable)

    function actualizarConfirmar() {
      btnConfirmar.disabled = seleccion.length === 0 ||
        (seleccion.includes('OTRO') && otroTexto.value.trim() === '');
    }

    function pintarSeleccion() {
      const soloCupra = seleccion.length === 1 && seleccion[0] === CUPRA;
      planes.forEach(b => {
        b.classList.toggle('elegido', seleccion.includes(b.dataset.plan));
        b.classList.toggle('combinable', soloCupra && COMBINABLES.includes(b.dataset.plan));
      });
      pista.classList.toggle('visible', soloCupra);
      otroWrap.classList.toggle('visible', seleccion.includes('OTRO'));
      actualizarConfirmar();
    }

    function elegirPlan(plan) {
      const tieneCupra = seleccion.includes(CUPRA);

      if (seleccion.includes(plan)) {
        // Pulsar un plan ya elegido lo quita
        seleccion = seleccion.filter(p => p !== plan);
      } else if (COMBINABLES.includes(plan) && tieneCupra) {
        // Cupra + Riaño o Cupra + pueblo (solo uno de los dos)
        seleccion = [CUPRA, plan];
      } else if (plan === CUPRA && seleccion.length === 1 && COMBINABLES.includes(seleccion[0])) {
        seleccion = [CUPRA, seleccion[0]];
      } else {
        seleccion = [plan];
      }

      if (plan === CUPRA && seleccion.includes(CUPRA)) animacionCupra();
      if (plan === 'OTRO' && seleccion.includes('OTRO')) otroTexto.focus();
      pintarSeleccion();
    }

    // Logo de Cupra: si no existe cupra-logo.png se muestra el texto "CUPRA"
    const cupraOverlay = document.getElementById('cupra-overlay');
    const cupraMarca = document.getElementById('cupra-marca');
    const cupraLogo = document.getElementById('cupra-logo');
    cupraLogo.addEventListener('error', () => cupraMarca.classList.add('sin-logo'));
    if (cupraLogo.complete && cupraLogo.naturalWidth === 0) cupraMarca.classList.add('sin-logo');

    function animacionCupra() {
      cupraOverlay.classList.remove('visible');
      void cupraOverlay.offsetWidth; // reinicia la animación
      cupraOverlay.classList.add('visible');
    }
    const cerrarCupra = () => cupraOverlay.classList.remove('visible');
    cupraOverlay.addEventListener('animationend', (e) => { if (e.target === cupraOverlay) cerrarCupra(); });
    cupraOverlay.addEventListener('click', cerrarCupra);

    planes.forEach(btn => {
      btn.addEventListener('click', () => elegirPlan(btn.dataset.plan));
    });
    otroTexto.addEventListener('input', actualizarConfirmar);

    let planFinal = '';

    btnConfirmar.addEventListener('click', () => {
      if (seleccion[0] === 'OTRO') {
        planFinal = otroTexto.value.trim();
      } else if (seleccion.length === 2) {
        // "Vuelta en el Cupra y comida en Riaño"
        const segundo = seleccion[1];
        planFinal = `${seleccion[0]} y ${segundo.charAt(0).toLowerCase()}${segundo.slice(1)}`;
      } else {
        planFinal = seleccion[0];
      }
      mostrar('p-fecha');
    });

    // ---------- Pantalla 3: fecha y hora ----------
    const inputFecha = document.getElementById('fecha');
    const inputHora = document.getElementById('hora');
    const btnFechaOk = document.getElementById('btn-fecha-ok');

    // No se puede elegir un día que ya ha pasado
    const hoy = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    inputFecha.min = `${hoy.getFullYear()}-${pad(hoy.getMonth() + 1)}-${pad(hoy.getDate())}`;

    function actualizarFechaOk() {
      btnFechaOk.disabled = !inputFecha.value || !inputHora.value || inputFecha.value < inputFecha.min;
    }
    inputFecha.addEventListener('input', actualizarFechaOk);
    inputHora.addEventListener('input', actualizarFechaOk);

    btnFechaOk.addEventListener('click', () => {
      const [a, m, d] = inputFecha.value.split('-').map(Number);
      const fechaTexto = new Date(a, m - 1, d).toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long'
      });
      const horaTexto = inputHora.value;

      document.getElementById('plan-final').textContent = planFinal;
      document.getElementById('fecha-final').textContent = fechaTexto;
      document.getElementById('hora-final').textContent = horaTexto;

      const msg = `¡Sí! Me apunto. Plan elegido: ${planFinal}, el ${fechaTexto} a las ${horaTexto}`;
      document.getElementById('btn-whatsapp').href = 'https://wa.me/?text=' + encodeURIComponent(msg);
      mostrar('p-fin');
    });

    document.getElementById('btn-volver-plan').addEventListener('click', () => mostrar('p-planes'));
    document.getElementById('btn-volver').addEventListener('click', () => mostrar('p-planes'));
  </script>
</body>
</html>
